name: Contract and Authorisation CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bantuan_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      PORT: 3000
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/bantuan_test
      OIDC_ISSUER: http://127.0.0.1:9999
      OIDC_JWKS_URI: http://127.0.0.1:9999/jwks.json
      OIDC_AUDIENCE: bantuan-lapangan-api
      BASE_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: service/package-lock.json

      - name: Apply database schema
        run: psql "$DATABASE_URL" -f service/db/schema.sql

      - name: Apply seed data
        run: psql "$DATABASE_URL" -f service/db/seed.sql

      - name: Install dependencies
        run: cd service && npm ci

      - name: Start test JWKS server
        run: |
          node tests/helpers/jwks-server.js > /tmp/jwks.log 2>&1 &
          for i in $(seq 1 15); do
            curl -sf "$OIDC_JWKS_URI" > /dev/null 2>&1 && break
            sleep 1
          done
          curl -sf "$OIDC_JWKS_URI" || (cat /tmp/jwks.log && exit 1)

      - name: Start service
        run: |
          cd service && node src/app.js > /tmp/service.log 2>&1 &
          for i in $(seq 1 15); do
            curl -sf http://localhost:3000/health > /dev/null 2>&1 && break
            sleep 1
          done
          curl -sf http://localhost:3000/health || (echo "=== SERVICE LOG ===" && cat /tmp/service.log && exit 1)

      - name: Run contract conformance tests
        run: bash tests/contract/contract.test.sh

      - name: Run authorisation tests
        run: node --test tests/authz/

      - name: Check that no token leaked into the logs
        run: |
          if grep -RniE 'bearer ey[A-Za-z0-9_-]{10,}' /tmp/service.log /tmp/jwks.log 2>/dev/null; then
            echo "STILL LEAKING"; exit 1
          else
            echo "clean"
          fi
