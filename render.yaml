services:
  - type: web
    name: paket-bantuan-lapangan
    runtime: node
    rootDir: service
    buildCommand: npm install
    startCommand: node src/app.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: bantuan-lapangan-db
          property: connectionString
      - key: BASE_URL
        sync: false        # fill in manually after first deploy with the Render URL
      - key: PORT
        value: 3000

databases:
  - name: bantuan-lapangan-db
    databaseName: bantuan_lapangan
    user: bantuan_user
    plan: free
